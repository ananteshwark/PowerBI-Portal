name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_test
        options: >-
          --health-cmd "pg_isready -U portal -d portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']

    env:
      DATABASE_URL: postgresql://portal:portal@localhost:5432/portal_test
      # Set so the refresh-rotation and report-access suites run instead of
      # skipping. Without it they self-skip and CI goes green having tested
      # none of the authorization logic.
      TEST_DATABASE_URL: postgresql://portal:portal@localhost:5432/portal_test
      # Placeholders: config/env.ts validates shape at import time, and every
      # test that would reach Azure stubs the client. No real credentials are
      # needed, and none should ever be added here.
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
      AZURE_TENANT_ID: 00000000-0000-0000-0000-000000000000
      AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      AZURE_CLIENT_SECRET: ci-placeholder
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npm run migrate

      # Guards against a migration that only applies to an already-populated
      # database — the failure mode you otherwise discover during a deploy.
      - name: Migrations are idempotent
        run: npm run migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The blocker this repo actually shipped: start pointed at dist/server.js
      # while tsc emitted dist/src/server.js. Typecheck and tests both passed,
      # because neither runs the built artifact. So run it.
      - name: Built artifact starts and serves
        env:
          PORT: 4599
          LOG_LEVEL: warn
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4599/api/health/live" >/dev/null 2>&1; then
              echo "compiled server is serving"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "::error::compiled server did not serve /api/health/live within 30s"
          kill $SERVER_PID 2>/dev/null
          exit 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Reports without blocking, deliberately. The baseline is not clean and
    # cannot be cleaned from here: frontend carries 3 high advisories against
    # sharp/libvips, reachable only through next's image optimiser, and npm's
    # only offered fix is a major bump to next 16. This project renders no
    # images and does not use next/image, so the exposure is theoretical — but
    # it is a real advisory, so it stays visible rather than being suppressed.
    # Promote to a hard gate once the baseline is clean.
    continue-on-error: true
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit ${{ matrix.workspace }}
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=high
